name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline de datos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.12
      - run: uv sync --all-groups --all-extras
      - run: uv run ruff check .
      - run: uv run pytest

  gtfs:
    name: Validador GTFS de MobilityData
    runs-on: ubuntu-latest
    env:
      VALIDADOR: 8.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.12
      - name: GTFS de prueba generado de nuevo desde las capturas de prueba
        working-directory: pipeline
        run: |
          uv sync --all-groups
          uv run python ../fixtures/generar_fixtures_rutas.py
          git diff --exit-code -- ../fixtures/web/data/rutas/*.json ../fixtures/web/data/rutas/*.geojson || (echo "Los datos de prueba de rutas no están al día" && exit 1)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Validar
        run: |
          curl -sSfL -o validador.jar "https://github.com/MobilityData/gtfs-validator/releases/download/v${VALIDADOR}/gtfs-validator-${VALIDADOR}-cli.jar"
          for feed in fixtures/web/data/rutas/gtfs.zip web/public/data/rutas/gtfs.zip; do
            [ -f "$feed" ] || continue
            echo "== $feed"
            rm -rf salida-gtfs
            java -jar validador.jar -i "$feed" -o salida-gtfs
            python3 scripts/revisar_gtfs.py salida-gtfs/report.json
          done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validacion-gtfs
          path: salida-gtfs
          retention-days: 7

  web:
    name: Web, pruebas y presupuestos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint, textos y contraste
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Build de producción (falla si hay datos FIXTURE o se rompe un presupuesto)
        run: npm run build
      - name: Build con datos de prueba para las pruebas de interfaz
        run: npm run build:fixtures
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Playwright y axe-core sobre el build de producción
        run: npm run test:e2e
      - name: Playwright y axe-core sobre el build con datos de prueba
        run: npm run test:e2e
        env:
          DIST: dist-fixtures
          PORT: '4322'
      - name: Lighthouse CI (móvil, Slow 4G, CPU 4x)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npx lhci autorun
          LHCI_DIST=./dist-fixtures LHCI_PUERTO=4501 LHCI_PAGINAS=/,/311,/311/bella-vista,/empleo,/empleo/tecnologia,/empleo/informe,/rutas,/captura npx lhci autorun
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            web/playwright-report
            web/test-results
            web/.lighthouseci
          retention-days: 7
