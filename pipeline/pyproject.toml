[project]
name = "palante-pipeline"
version = "0.1.0"
description = "Pipeline de datos de Palante: convierte datos públicos de Panamá en JSON pequeños para la web."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "topojson>=1.9",
    "pydantic>=2.9",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
empleo = ["anthropic>=1.11"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]
fuentes = ["fonttools[woff]>=4.54"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["palante_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
