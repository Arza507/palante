name: Publicar

# Publicación manual en Cloudflare Pages. Por defecto publica una vista previa, no producción.
# Producción solo la decide Iker (SPEC.md, sección 12).
# Requiere los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID y las variables del repositorio
# PUBLIC_SITE_URL, PUBLIC_CF_BEACON_TOKEN y PUBLIC_CONTACTO_EMAIL.
on:
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama de Cloudflare Pages: "vista-previa" o "main" (producción)'
        required: true
        default: vista-previa

permissions:
  contents: read
  deployments: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: ${{ inputs.rama == 'main' && 'produccion' || 'vista-previa' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build de producción
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_CONTACTO_EMAIL: ${{ vars.PUBLIC_CONTACTO_EMAIL }}
          PUBLIC_RUTAS: ${{ vars.PUBLIC_RUTAS }}
          PUBLIC_PMTILES_URL: ${{ vars.PUBLIC_PMTILES_URL }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=palante --branch=${{ inputs.rama }}
